<div class="chat-container">
  <div class="chat-messages">
    <div class="grid gap-y-2">
      <!-- Chat Messages -->

      @for (item of messages(); track $index) {
        @if (item.isGpt) {
          <app-gpt-message-orthohraphy [userScore]="item.userScore || 0" [errors]="item.errors || []" [message]="item.text">
          </app-gpt-message-orthohraphy>
        } @else {
          <app-my-message [text]="item.text" />
        }
      }

      @if (isTyping()) {
      <app-typing-loader />
      }
    </div>
  </div>
  <!-- MessageBox -->
  <app-text-message-box placeholder="Write your message here..." (onMessage)="handleMessage($event)" />

</div>
